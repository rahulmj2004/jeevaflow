<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Conflict detection" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="270" fill="#FFFFFF"/><rect x="20" y="30" width="230" height="80" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="135.0" y="60.75" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Document A · lab report</text><text x="135.0" y="77.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Report Date 15/06/2026</text><text x="135.0" y="91.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">HbA1c: 9.4 %</text><rect x="20" y="140" width="230" height="80" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="135.0" y="170.75" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Document B · transcribed copy</text><text x="135.0" y="187.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Report Date 15/06/2026</text><text x="135.0" y="201.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">HbA1c: 8.2 %</text><rect x="300" y="70" width="250" height="110" rx="8" fill="#F1EBFE" stroke="#6D28D9" stroke-width="1.4"/><text x="425.0" y="109.25" font-size="13.5" font-weight="600" fill="#6D28D9" text-anchor="middle">detect_observation_conflicts()</text><text x="425.0" y="125.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">group by (test, date)</text><text x="425.0" y="139.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">&gt; 1 distinct (value, unit)</text><text x="425.0" y="153.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">rejected observations excluded</text><path d="M250,70 L275,70 L275,125 L297,125" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M250,180 L275,180 L275,125" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="600" y="30" width="280" height="190" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.4"/><text x="740.0" y="72.25" font-size="13.5" font-weight="600" fill="#B91C1C" text-anchor="middle">CONFLICT</text><text x="740.0" y="88.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">status HUMAN_REVIEW_REQUIRED</text><text x="740.0" y="103.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">both values kept, each with</text><text x="740.0" y="117.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">its own evidence + source link</text><text x="740.0" y="132.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle"></text><text x="740.0" y="146.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">JeevaFlow does not pick a value.</text><text x="740.0" y="161.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">The doctor verifies or rejects</text><text x="740.0" y="175.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">each observation; a rejected</text><text x="740.0" y="190.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">one leaves the conflict set.</text><line x1="550" y1="125" x2="597" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="20" y="250" font-size="11.5" font-weight="600" fill="#475569" text-anchor="start">Different dates (9.4 % on 15 Jun, 8.1 % on 20 Sep) form a series, not a conflict.</text></svg>