<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Single-use evidence token" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="300" fill="#FFFFFF"/><rect x="20" y="40" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="110.0" y="70.0" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Request token</text><text x="110.0" y="86.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">POST /doctor/evidence/</text><text x="110.0" y="100.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">{id}/view-token</text><text x="110.0" y="113.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">needs SOURCE_DOCUMENTS</text><rect x="240" y="40" width="180" height="90" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.4"/><text x="330.0" y="70.0" font-size="13.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Token issued</text><text x="330.0" y="86.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">random 32 bytes; only</text><text x="330.0" y="100.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">HMAC stored; bound to</text><text x="330.0" y="113.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">session + doctor; 60 s</text><rect x="460" y="40" width="180" height="90" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="550.0" y="70.0" font-size="13.5" font-weight="600" fill="#0F766E" text-anchor="middle">First view</text><text x="550.0" y="86.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">GET …/evidence/view/{t}</text><text x="550.0" y="100.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">used_at set; consent</text><text x="550.0" y="113.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">re-checked now</text><rect x="680" y="40" width="200" height="90" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="780.0" y="70.0" font-size="13.5" font-weight="600" fill="#0F766E" text-anchor="middle">Rendered region</text><text x="780.0" y="86.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">worker renders one page,</text><text x="780.0" y="100.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">highlight + watermark</text><text x="780.0" y="113.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(doctor ref + UTC time)</text><line x1="200" y1="85" x2="237" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="420" y1="85" x2="457" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="640" y1="85" x2="677" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="460" y="170" width="420" height="100" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.4"/><text x="670.0" y="196.75" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="middle">Rejected (403, EVIDENCE_TOKEN_REJECTED)</text><text x="670.0" y="212.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">TOKEN_REUSED — second use of the same URL</text><text x="670.0" y="226.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">TOKEN_EXPIRED — after 60 seconds</text><text x="670.0" y="240.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">SESSION_MISMATCH — another session / doctor</text><text x="670.0" y="254.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">consent revoked between issue and view</text><line x1="550" y1="130" x2="550" y2="167" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#arrow-red)"/><rect x="20" y="170" width="400" height="100" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="220.0" y="203.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Delivery</text><text x="220.0" y="219.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">PNG with Cache-Control: no-store, private</text><text x="220.0" y="233.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">held as an in-memory blob URL (SecureEvidence.tsx)</text><text x="220.0" y="247.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">no endpoint serves the original file</text></svg>