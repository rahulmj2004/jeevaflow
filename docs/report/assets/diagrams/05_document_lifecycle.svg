<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Document lifecycle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="420" fill="#FFFFFF"/><text x="20" y="26" font-size="12" font-weight="700" fill="#0F766E" text-anchor="start">receive_document()  — runs before any OTP / consent</text><rect x="20" y="40" width="132" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="86.0" y="66.25" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Upload / media</text><text x="86.0" y="81.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">portal, camera</text><text x="86.0" y="95.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">or WhatsApp</text><rect x="166" y="40" width="132" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="232.0" y="66.25" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Validate</text><text x="232.0" y="81.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">≤10 MB, PDF/JPG/PNG,</text><text x="232.0" y="95.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">magic bytes</text><line x1="153" y1="75" x2="163" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="312" y="40" width="132" height="70" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="378.0" y="66.25" font-size="12.5" font-weight="600" fill="#0F766E" text-anchor="middle">Worker inspect</text><text x="378.0" y="81.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">active content, pages,</text><text x="378.0" y="95.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">bombs, sanitise</text><line x1="299" y1="75" x2="309" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="458" y="40" width="132" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="524.0" y="66.25" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Scan</text><text x="524.0" y="81.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">ClamAV or heuristic,</text><text x="524.0" y="95.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">original + sanitised</text><line x1="445" y1="75" x2="455" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="604" y="40" width="132" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="670.0" y="66.25" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Hash + dedupe</text><text x="670.0" y="81.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">SHA-256 per</text><text x="670.0" y="95.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">patient</text><line x1="591" y1="75" x2="601" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="750" y="40" width="132" height="70" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="816.0" y="66.25" font-size="12.5" font-weight="600" fill="#0F766E" text-anchor="middle">Encrypt + store</text><text x="816.0" y="81.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">AES-256-GCM DEK,</text><text x="816.0" y="95.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">status QUARANTINED</text><line x1="737" y1="75" x2="747" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="140" width="860" height="44" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.4"/><text x="450.0" y="166.5" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">Any failure ⇒ FileValidationError: nothing stored, DOCUMENT_REJECTED audited with a code (e.g. SUSPICIOUS_PDF:JAVASCRIPT)</text><line x1="450" y1="113" x2="450" y2="137" stroke="#B91C1C" stroke-width="1.5" marker-end="url(#arrow-red)"/><text x="20" y="222" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="start">process_document()  — only after OTP verification AND an active consent</text><rect x="20" y="236" width="132" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="86.0" y="269.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Decrypt in memory</text><text x="86.0" y="284.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">vault.load()</text><rect x="166" y="236" width="132" height="70" rx="8" fill="#F1EBFE" stroke="#6D28D9" stroke-width="1.4"/><text x="232.0" y="262.25" font-size="12.5" font-weight="600" fill="#6D28D9" text-anchor="middle">Isolated OCR</text><text x="232.0" y="277.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">fresh process, no</text><text x="232.0" y="291.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">secrets, no network</text><line x1="153" y1="271" x2="163" y2="271" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="312" y="236" width="132" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="378.0" y="262.25" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Rule extraction</text><text x="378.0" y="277.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">labs, instructions,</text><text x="378.0" y="291.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">medications</text><line x1="299" y1="271" x2="309" y2="271" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="458" y="236" width="132" height="70" rx="8" fill="#F1EBFE" stroke="#6D28D9" stroke-width="1.4"/><text x="524.0" y="262.25" font-size="12.5" font-weight="600" fill="#6D28D9" text-anchor="middle">Quote-or-reject</text><text x="524.0" y="277.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">unanchored items</text><text x="524.0" y="291.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">are dropped</text><line x1="445" y1="271" x2="455" y2="271" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="604" y="236" width="132" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="670.0" y="262.25" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Store facts</text><text x="670.0" y="277.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">status REVIEW;</text><text x="670.0" y="291.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">PROCESSED</text><line x1="591" y1="271" x2="601" y2="271" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="750" y="236" width="132" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="816.0" y="262.25" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Match loops</text><text x="816.0" y="277.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">POTENTIAL_MATCH</text><text x="816.0" y="291.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">suggestions only</text><line x1="737" y1="271" x2="747" y2="271" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M816,110 L816,128 L900,128" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><rect x="20" y="336" width="420" height="66" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="230.0" y="360.75" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Retention (retention.py, every 5 min)</text><text x="230.0" y="377.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">unverified quarantined docs shredded when txn expires;</text><text x="230.0" y="390.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">all docs crypto-shredded after 90 days</text><rect x="460" y="336" width="420" height="66" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="670.0" y="360.75" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Deletion = crypto-shredding (vault.destroy)</text><text x="670.0" y="377.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">destroy wrapped DEK → overwrite + unlink object</text><text x="670.0" y="390.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">→ delete DB rows → DOCUMENT_DELETED audit</text></svg>