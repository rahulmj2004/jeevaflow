<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Staff password plus TOTP" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="250" fill="#FFFFFF"/><rect x="20" y="40" width="200" height="90" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="120.0" y="70.0" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Step 1 · password</text><text x="120.0" y="86.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">POST /api/v1/auth/login</text><text x="120.0" y="100.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">scrypt (N=2¹⁴, r=8, p=1)</text><text x="120.0" y="113.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">dummy hash for unknown users</text><rect x="260" y="40" width="200" height="90" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="360.0" y="76.75" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Pending-MFA cookie</text><text x="360.0" y="93.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">5-minute, not yet a</text><text x="360.0" y="106.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">session (no data access)</text><rect x="500" y="40" width="200" height="90" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.4"/><text x="600.0" y="70.0" font-size="13.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Step 2 · TOTP</text><text x="600.0" y="86.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">POST /api/v1/auth/mfa</text><text x="600.0" y="100.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">RFC 6238, 30 s, ±1 step</text><text x="600.0" y="113.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">used step cannot be replayed</text><rect x="740" y="40" width="140" height="90" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="810.0" y="70.0" font-size="13.5" font-weight="600" fill="#0F766E" text-anchor="middle">Staff session</text><text x="810.0" y="86.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">mfa_verified</text><text x="810.0" y="100.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">2 h max,</text><text x="810.0" y="113.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">20 min idle</text><line x1="220" y1="85" x2="257" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="460" y1="85" x2="497" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="700" y1="85" x2="737" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="160" width="860" height="60" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.4"/><text x="450.0" y="187.75" font-size="12.5" font-weight="600" fill="#B91C1C" text-anchor="middle">Failures</text><text x="450.0" y="203.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">5 failed logins ⇒ 15-minute lockout · generic “Authentication required.” · LOGIN_FAILED / MFA_FAILED audited · cookies HttpOnly, SameSite=Strict, path=/api</text></svg>