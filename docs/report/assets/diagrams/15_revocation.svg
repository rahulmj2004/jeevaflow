<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Access revocation" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="200" fill="#FFFFFF"/><rect x="20" y="40" width="158" height="70" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="99.0" y="73.0" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">Active consent</text><text x="99.0" y="89.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">doctor reads form</text><rect x="196" y="40" width="158" height="70" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.4"/><text x="275.0" y="73.0" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">Patient revokes</text><text x="275.0" y="89.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST …/revoke</text><line x1="178" y1="75" x2="193" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="372" y="40" width="158" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="451.0" y="73.0" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Next doctor request</text><text x="451.0" y="89.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">authorize_doctor()</text><line x1="354" y1="75" x2="369" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="548" y="40" width="158" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="627.0" y="73.0" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">No active consent</text><text x="627.0" y="89.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">query finds none</text><line x1="530" y1="75" x2="545" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="724" y="40" width="158" height="70" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.4"/><text x="803.0" y="73.0" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">403 + audit</text><text x="803.0" y="89.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">DOCTOR_ACCESS_DENIED</text><line x1="706" y1="75" x2="721" y2="75" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="20" y="150" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">No caches or long-lived grants: the patient list, form, journey, loops, conflicts, evidence and view tokens all re-run</text><text x="20" y="168" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">the consent query per request, so revocation takes effect on the very next call (live check: 403 immediately after revoke).</text></svg>