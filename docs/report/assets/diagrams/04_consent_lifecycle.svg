<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Consent lifecycle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="330" fill="#FFFFFF"/><rect x="20" y="120" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="95.0" y="146.25" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Select doctor</text><text x="95.0" y="162.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">portal session:</text><text x="95.0" y="176.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">doctor, scopes, 1/7/30 d</text><rect x="220" y="120" width="150" height="70" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.4"/><text x="295.0" y="146.75" font-size="13.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">GRANT</text><text x="295.0" y="163.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">POST /portal/consents</text><text x="295.0" y="176.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">CONSENT_GRANTED</text><rect x="420" y="120" width="150" height="70" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="495.0" y="146.25" font-size="13.5" font-weight="600" fill="#0F766E" text-anchor="middle">ACTIVE</text><text x="495.0" y="162.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">checked on every</text><text x="495.0" y="176.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">doctor request</text><rect x="660" y="20" width="220" height="70" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.4"/><text x="770.0" y="46.75" font-size="13.5" font-weight="600" fill="#B91C1C" text-anchor="middle">REVOKED</text><text x="770.0" y="63.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">POST …/{ref}/revoke</text><text x="770.0" y="76.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">revoked_at set · CONSENT_REVOKED</text><rect x="660" y="120" width="220" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/><text x="770.0" y="146.75" font-size="13.5" font-weight="600" fill="#B45309" text-anchor="middle">ENDED NOW</text><text x="770.0" y="163.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">POST …/{ref}/expire</text><text x="770.0" y="176.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">expires_at = now</text><rect x="660" y="220" width="220" height="70" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="770.0" y="246.75" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">EXPIRED</text><text x="770.0" y="263.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">time passes expires_at;</text><text x="770.0" y="276.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">retention job audits once</text><line x1="170" y1="155" x2="217" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="370" y1="155" x2="417" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M570,140 L615,140 L615,55 L657,55" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="570" y1="155" x2="657" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M570,170 L615,170 L615,255 L657,255" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450" y="225" font-size="11.5" font-weight="600" fill="#B91C1C" text-anchor="middle">Any of the three ⇒ authorize_doctor() finds</text><text x="450" y="241" font-size="11.5" font-weight="600" fill="#B91C1C" text-anchor="middle">no active consent ⇒ generic 403 on the next request</text><text x="20" y="312" font-size="11" font-weight="400" fill="#475569" text-anchor="start">There is no doctor-initiated “request” state in the code: consent is patient-initiated from the verified portal. Purpose is fixed to CLINICAL_REVIEW.</text></svg>