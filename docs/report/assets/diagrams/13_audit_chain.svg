<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Tamper-evident audit chain" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="380" fill="#FFFFFF"/><rect x="20" y="30" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="115.0" y="56.25" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Event #1</text><text x="115.0" y="72.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">seq · time · actor · action</text><text x="115.0" y="85.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">object · result · reason</text><text x="115.0" y="99.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">prev_hash = GENESIS 000…0</text><text x="115.0" y="112.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">event_hash = SHA-256(…)</text><text x="115.0" y="126.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">mac = HMAC(audit key)</text><rect x="240" y="30" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="335.0" y="56.25" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Event #2</text><text x="335.0" y="72.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">seq · time · actor · action</text><text x="335.0" y="85.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">object · result · reason</text><text x="335.0" y="99.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">prev_hash = hash(#1)</text><text x="335.0" y="112.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">event_hash = SHA-256(…)</text><text x="335.0" y="126.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">mac = HMAC(audit key)</text><rect x="460" y="30" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="555.0" y="56.25" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Event #3</text><text x="555.0" y="72.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">seq · time · actor · action</text><text x="555.0" y="85.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">object · result · reason</text><text x="555.0" y="99.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">prev_hash = hash(#2)</text><text x="555.0" y="112.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">event_hash = SHA-256(…)</text><text x="555.0" y="126.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">mac = HMAC(audit key)</text><rect x="680" y="30" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="775.0" y="56.25" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Event #4</text><text x="775.0" y="72.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">seq · time · actor · action</text><text x="775.0" y="85.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">object · result · reason</text><text x="775.0" y="99.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">prev_hash = hash(#3)</text><text x="775.0" y="112.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">event_hash = SHA-256(…)</text><text x="775.0" y="126.25" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">mac = HMAC(audit key)</text><line x1="210" y1="85" x2="237" y2="85" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-teal)"/><line x1="430" y1="85" x2="457" y2="85" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-teal)"/><line x1="650" y1="85" x2="677" y2="85" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-teal)"/><rect x="680" y="160" width="190" height="50" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="775.0" y="182.75" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">Anchor (identity DB)</text><text x="775.0" y="197.75" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">head_seq + head_hash</text><line x1="775" y1="140" x2="775" y2="157" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="20" y="245" font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="start">verify_chain() walks every event in order and reports the FIRST failure:</text><text x="40" y="270" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">SEQUENCE_GAP</text><text x="260" y="270" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">an event was deleted or inserted</text><text x="40" y="290" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">PREVIOUS_HASH_MISMATCH</text><text x="260" y="290" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">events were reordered or relinked</text><text x="40" y="310" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">EVENT_HASH_MISMATCH</text><text x="260" y="310" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">a stored field was modified</text><text x="40" y="330" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">MAC_MISMATCH</text><text x="260" y="330" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">hash recomputed without the audit key</text><text x="40" y="350" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">ANCHOR_MISMATCH</text><text x="260" y="350" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="start">the tail was truncated</text><rect x="560" y="240" width="320" height="120" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="720.0" y="271.0" font-size="12.5" font-weight="600" fill="#0F766E" text-anchor="middle">Also enforced</text><text x="720.0" y="286.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">SQLite triggers block UPDATE and</text><text x="720.0" y="300.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">DELETE on audit_events</text><text x="720.0" y="313.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">events hold refs and codes only</text><text x="720.0" y="327.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(usr_…, pt_…, doc_…), never PHI</text><text x="720.0" y="340.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">auditor/admin: GET /audit/events</text></svg>