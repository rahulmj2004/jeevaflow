<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="WhatsApp trust boundary" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="400" fill="#FFFFFF"/><rect x="15" y="30" width="300" height="350" rx="12" fill="#FEF3C7" fill-opacity="0.55" stroke="#B45309" stroke-opacity="0.45" stroke-width="1"/><text x="29" y="50" font-size="11" font-weight="700" fill="#B45309" text-anchor="start">OUTSIDE THE BOUNDARY (UNTRUSTED)</text><rect x="345" y="30" width="540" height="350" rx="12" fill="#E6F4F1" fill-opacity="0.55" stroke="#0F766E" stroke-opacity="0.45" stroke-width="1"/><text x="359" y="50" font-size="11" font-weight="700" fill="#0F766E" text-anchor="start">JEEVAFLOW CONTROLLED ENVIRONMENT</text><rect x="40" y="70" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="165.0" y="96.0" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">Patient's WhatsApp</text><text x="165.0" y="112.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">sends PDF / photo / text</text><rect x="40" y="160" width="250" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/><text x="165.0" y="186.0" font-size="13.5" font-weight="600" fill="#B45309" text-anchor="middle">Twilio (WhatsApp API)</text><text x="165.0" y="202.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">signs every webhook (HMAC-SHA1)</text><rect x="40" y="250" width="250" height="104" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="165.0" y="279.25" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">What goes back to WhatsApp</text><text x="165.0" y="295.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">generic templates only:</text><text x="165.0" y="309.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">“securely received…”, OTP,</text><text x="165.0" y="323.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">“processed — continue to portal”.</text><text x="165.0" y="337.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">No results, no medicines.</text><line x1="165" y1="126" x2="165" y2="157" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="370" y="62" width="330" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="382" y="84.5" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">Body cap 64 KB + per-IP rate limit</text><rect x="370" y="106" width="330" height="36" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/><text x="382" y="128.5" font-size="12" font-weight="600" fill="#B45309" text-anchor="start">X-Twilio-Signature (fails closed, 403)</text><rect x="370" y="150" width="330" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="382" y="172.5" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">MessageSid replay table + AccountSid check</text><rect x="370" y="194" width="330" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="382" y="216.5" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">Freshness check (≤ 10 min) + per-sender limit</text><rect x="370" y="238" width="330" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="382" y="260.5" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">Enrolled number? else generic reply, no download</text><rect x="370" y="282" width="330" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="382" y="304.5" font-size="12" font-weight="600" fill="#0F172A" text-anchor="start">Media fetched server-side, then deleted at Twilio</text><rect x="370" y="326" width="330" height="36" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="382" y="348.5" font-size="12" font-weight="600" fill="#0F766E" text-anchor="start">receive_document() → quarantine (not read yet)</text><line x1="535" y1="98" x2="535" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="535" y1="142" x2="535" y2="149" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="535" y1="186" x2="535" y2="193" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="535" y1="230" x2="535" y2="237" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="535" y1="274" x2="535" y2="281" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="535" y1="318" x2="535" y2="325" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M290,188 L330,188 L330,80 L366,80" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="720" y="150" width="150" height="140" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.4"/><text x="795.0" y="190.25" font-size="13.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">Portal link + OTP</text><text x="795.0" y="206.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">patient continues</text><text x="795.0" y="220.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">in the JeevaFlow</text><text x="795.0" y="234.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">portal, not in chat:</text><text x="795.0" y="248.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">verify → consent</text><text x="795.0" y="262.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">→ processing</text><line x1="700" y1="350" x2="790" y2="293" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M366,330 L330,330 L330,300 L292,300" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-teal)"/></svg>