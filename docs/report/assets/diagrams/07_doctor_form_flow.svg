<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="From scattered documents to the doctor-ready form" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="470" fill="#FFFFFF"/><rect x="20" y="30" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="115.0" y="53.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Synthetic prescription</text><text x="115.0" y="69.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">20 Sep 2026</text><path d="M210,56 L240,56 L240,215 L262,215" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="94" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="115.0" y="117.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Synthetic lab report</text><text x="115.0" y="133.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">15 Jun 2026</text><path d="M210,120 L240,120 L240,215 L262,215" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="158" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="115.0" y="181.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Follow-up HbA1c</text><text x="115.0" y="197.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">20 Sep 2026</text><path d="M210,184 L240,184 L240,215 L262,215" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="20" y="222" width="190" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="115.0" y="245.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Transcribed copy</text><text x="115.0" y="261.25" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">15 Jun 2026</text><path d="M210,248 L240,248 L240,215 L262,215" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="265" y="22" width="300" height="52" rx="8" fill="#F1EBFE" stroke="#6D28D9" stroke-width="1.4"/><text x="415.0" y="46.0" font-size="12.5" font-weight="600" fill="#6D28D9" text-anchor="middle">Extraction</text><text x="415.0" y="61.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">rules + local OCR</text><rect x="265" y="88" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="415.0" y="112.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Normalisation</text><text x="415.0" y="127.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">“1-0-1” → twice daily (AI_INFERRED label)</text><line x1="415" y1="74" x2="415" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="265" y="154" width="300" height="52" rx="8" fill="#F1EBFE" stroke="#6D28D9" stroke-width="1.4"/><text x="415.0" y="178.0" font-size="12.5" font-weight="600" fill="#6D28D9" text-anchor="middle">Facts + states</text><text x="415.0" y="193.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">SOURCE_FACT / AI_INFERRED / UNCERTAIN / MISSING</text><line x1="415" y1="140" x2="415" y2="151" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="265" y="220" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="415.0" y="244.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Timeline</text><text x="415.0" y="259.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">ordered by report date</text><line x1="415" y1="206" x2="415" y2="217" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="265" y="286" width="300" height="52" rx="8" fill="#F1EBFE" stroke="#6D28D9" stroke-width="1.4"/><text x="415.0" y="310.0" font-size="12.5" font-weight="600" fill="#6D28D9" text-anchor="middle">Conflicts</text><text x="415.0" y="325.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">same test, same date</text><line x1="415" y1="272" x2="415" y2="283" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="265" y="352" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="415.0" y="376.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Care loops</text><text x="415.0" y="391.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">instructions + potential matches</text><line x1="415" y1="338" x2="415" y2="349" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="565" y1="215" x2="600" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="605" y="22" width="275" height="400" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="617" y="97.0" font-size="14" font-weight="600" fill="#0F766E" text-anchor="start">DOCTOR-READY FORM</text><text x="617" y="114.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">GET /doctor/patients/{ref}/form</text><text x="617" y="128.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start"></text><text x="617" y="143.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Patient reference (+ name/DOB</text><text x="617" y="157.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">   only with DEMOGRAPHICS scope)</text><text x="617" y="172.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Consent ref, scopes, expiry</text><text x="617" y="186.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Medications: dose, frequency,</text><text x="617" y="201.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">   duration, each with a state</text><text x="617" y="215.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Prescriber (from source)</text><text x="617" y="230.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Laboratory results: latest +</text><text x="617" y="244.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">   earlier values, conflict flag</text><text x="617" y="259.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Allergies</text><text x="617" y="273.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Source-supported notes (loops)</text><text x="617" y="288.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Uncertain information</text><text x="617" y="302.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Missing information</text><text x="617" y="317.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Source evidence: document,</text><text x="617" y="331.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">   report date, SHA-256</text><text x="617" y="346.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• “Not shared” scopes listed</text><text x="617" y="360.5" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">• Notice: no diagnosis / prescribing</text><text x="20" y="450" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="start">Scopes not covered by the active consent are omitted server-side (doctor_brief.py), not hidden in the UI.</text></svg>