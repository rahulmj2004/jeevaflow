<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="Consent-based authorization decision" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="424" fill="#FFFFFF"/><rect x="20" y="20" width="430" height="44" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="32" y="40.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Staff session valid + MFA verified</text><text x="32" y="55.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">current_staff(): else 401</text><path d="M450,42 L520,42" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/><rect x="20" y="72" width="430" height="44" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="32" y="92.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Role is DOCTOR</text><text x="32" y="107.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">require_doctor: else 403</text><path d="M450,94 L520,94" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/><rect x="20" y="124" width="430" height="44" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="32" y="144.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">CSRF token on state changes</text><text x="32" y="159.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">X-CSRF-Token: else 403</text><path d="M450,146 L520,146" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/><rect x="20" y="176" width="430" height="44" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="32" y="196.0" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Per-doctor rate limit</text><text x="32" y="211.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">600 requests / 10 min</text><path d="M450,198 L520,198" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/><rect x="20" y="228" width="430" height="44" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.4"/><text x="32" y="248.0" font-size="12.5" font-weight="600" fill="#1D4ED8" text-anchor="start">Active consent: this patient → this doctor</text><text x="32" y="263.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">not revoked, not expired, CLINICAL_REVIEW</text><path d="M450,250 L520,250" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/><rect x="20" y="280" width="430" height="44" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.4"/><text x="32" y="300.0" font-size="12.5" font-weight="600" fill="#1D4ED8" text-anchor="start">Consent covers the scope read</text><text x="32" y="315.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">LABS, MEDICATIONS, SOURCE_DOCUMENTS …</text><path d="M450,302 L520,302" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/><rect x="20" y="332" width="430" height="44" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.4"/><text x="32" y="352.0" font-size="12.5" font-weight="600" fill="#1D4ED8" text-anchor="start">No bulk-access anomaly</text><text x="32" y="367.5" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">&gt; 25 distinct patients / hour ⇒ deny</text><path d="M450,354 L520,354" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/><text x="20" y="394" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Checks run top to bottom; the first failure denies.</text><rect x="525" y="20" width="355" height="340" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.4"/><text x="702.5" y="115.25" font-size="13" font-weight="600" fill="#B91C1C" text-anchor="middle">Generic 403 “Access not permitted.”</text><text x="702.5" y="131.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">Same response for an unknown patient</text><text x="702.5" y="145.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">and an unconsented one, so the API</text><text x="702.5" y="160.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">cannot be used to discover patients.</text><text x="702.5" y="174.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle"></text><text x="702.5" y="189.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">DOCTOR_ACCESS_DENIED is audited</text><text x="702.5" y="203.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">with a reason code: ROLE, NO_CONSENT,</text><text x="702.5" y="218.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">SCOPE, RATE_LIMIT, ANOMALY,</text><text x="702.5" y="232.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">UNKNOWN_OBJECT.</text><text x="702.5" y="247.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle"></text><text x="702.5" y="261.75" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">All checks pass ⇒ DOCTOR_ACCESS_GRANTED</text><text x="702.5" y="276.25" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">is audited and the data is returned.</text><text x="20" y="412" font-size="11" font-weight="600" fill="#0F766E" text-anchor="start">security/consent.py · authorize_doctor() — called by every patient-data route in routes/doctor.py</text></svg>