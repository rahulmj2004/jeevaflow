<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="Patient OTP verification sequence" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="560" fill="#FFFFFF"/><rect x="5" y="20" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="80.0" y="44.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Patient</text><line x1="80" y1="60" x2="80" y2="540" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/><rect x="175" y="20" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="250.0" y="44.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">WhatsApp / Twilio</text><line x1="250" y1="60" x2="250" y2="540" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/><rect x="355" y="20" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="430.0" y="44.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Webhook</text><line x1="430" y1="60" x2="430" y2="540" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/><rect x="535" y="20" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="610.0" y="44.75" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="middle">Portal (browser)</text><line x1="610" y1="60" x2="610" y2="540" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/><rect x="725" y="20" width="150" height="40" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.4"/><text x="800.0" y="44.75" font-size="12.5" font-weight="600" fill="#0F766E" text-anchor="middle">JeevaFlow API</text><line x1="800" y1="60" x2="800" y2="540" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/><line x1="80" y1="95" x2="246" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="165.0" y="89" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">1  document or “Hi”</text><line x1="250" y1="132" x2="426" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="126" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">2  signed POST</text><line x1="430" y1="169" x2="796" y2="169" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-teal)"/><text x="615.0" y="163" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">3  verify signature, replay, sender enrolled</text><path d="M800,200 l40,0 l0,14 l-37,0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="788" y="209" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="end">4  create txn_… + 6-digit OTP (HMAC stored)</text><line x1="430" y1="243" x2="254" y2="243" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340.0" y="237" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">5  generic reply + portal link</text><line x1="250" y1="280" x2="84" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="165.0" y="274" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">6  link + OTP</text><line x1="80" y1="317" x2="606" y2="317" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="345.0" y="311" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">7  open link, enter code</text><line x1="610" y1="354" x2="796" y2="354" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-teal)"/><text x="705.0" y="348" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">8  POST /api/v1/portal/verify</text><path d="M800,385 l40,0 l0,14 l-37,0" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="788" y="394" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="end">9  ≤5 tries, back-off, single use</text><line x1="800" y1="428" x2="614" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><text x="705.0" y="422" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">10  HttpOnly session cookie (15 min) + CSRF token</text><line x1="610" y1="465" x2="796" y2="465" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-teal)"/><text x="705.0" y="459" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">11  consent, documents (session + CSRF)</text><line x1="610" y1="502" x2="796" y2="502" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arrow-teal)"/><text x="705.0" y="496" font-size="11.5" font-weight="500" fill="#0F172A" text-anchor="middle">12  POST /api/v1/portal/logout → session revoked</text></svg>