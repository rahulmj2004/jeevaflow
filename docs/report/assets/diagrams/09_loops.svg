<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Care loop states" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="330" fill="#FFFFFF"/><rect x="20" y="120" width="150" height="70" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.4"/><text x="95.0" y="146.25" font-size="13.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">OPEN</text><text x="95.0" y="162.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">instruction read</text><text x="95.0" y="176.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">with evidence</text><rect x="230" y="20" width="170" height="70" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.4"/><text x="315.0" y="46.25" font-size="13.5" font-weight="600" fill="#B45309" text-anchor="middle">OVERDUE</text><text x="315.0" y="62.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">computed: OPEN and</text><text x="315.0" y="76.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">past due date</text><rect x="230" y="120" width="170" height="70" rx="8" fill="#F1EBFE" stroke="#6D28D9" stroke-width="1.4"/><text x="315.0" y="146.25" font-size="13.5" font-weight="600" fill="#6D28D9" text-anchor="middle">POTENTIAL_MATCH</text><text x="315.0" y="162.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">newer source-backed</text><text x="315.0" y="176.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">result (system)</text><rect x="230" y="220" width="170" height="70" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.4"/><text x="315.0" y="253.25" font-size="13.5" font-weight="600" fill="#0F172A" text-anchor="middle">NEEDS_REVIEW</text><text x="315.0" y="269.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">doctor: POST …/review</text><rect x="480" y="120" width="170" height="70" rx="8" fill="#E8F6EC" stroke="#15803D" stroke-width="1.4"/><text x="565.0" y="146.25" font-size="13.5" font-weight="600" fill="#15803D" text-anchor="middle">CLOSED</text><text x="565.0" y="162.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">doctor: POST …/</text><text x="565.0" y="176.75" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">confirm-completion</text><line x1="170" y1="140" x2="227" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="170" y1="155" x2="227" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="170" y1="170" x2="227" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="400" y1="155" x2="477" y2="155" stroke="#15803D" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M315,190 L315,217" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M230,140 C200,105 190,105 172,128" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="190" y="100" font-size="10.5" font-weight="500" fill="#475569" text-anchor="middle">keep-open</text><rect x="690" y="40" width="190" height="230" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/><text x="702" y="83.0" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Rules</text><text x="702" y="99.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">System may only suggest</text><text x="702" y="113.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">(matching.py): instruction</text><text x="702" y="127.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">names the test, newer</text><text x="702" y="141.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">document, evidence present,</text><text x="702" y="155.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">not rejected.</text><text x="702" y="169.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start"></text><text x="702" y="183.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Only a signed-in, MFA-</text><text x="702" y="197.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">verified doctor closes a</text><text x="702" y="211.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">loop. Every change is</text><text x="702" y="225.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">written to loop_events and</text><text x="702" y="239.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">the audit chain.</text><text x="20" y="318" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Due dates are derived from the stated interval (“after 3 months”) from the report date; “Follow-up with physician” has no interval, so no due date.</text></svg>