<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="Defense in depth" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker></defs><rect width="900" height="660" fill="#FFFFFF"/><rect x="20" y="15" width="860" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/><circle cx="46" cy="37" r="13" fill="#B45309"/><text x="46" y="41.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="70" y="34" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">Communication security</text><text x="70" y="50" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">Generic replies only; media deleted from Twilio; unknown numbers never become patients</text><rect x="28" y="66" width="844" height="44" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.3"/><circle cx="54" cy="88" r="13" fill="#B45309"/><text x="54" y="92.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="78" y="85" font-size="13" font-weight="700" fill="#B45309" text-anchor="start">Webhook verification</text><text x="78" y="101" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">X-Twilio-Signature (fails closed), replay, account, freshness, rate limits</text><rect x="36" y="117" width="828" height="44" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.3"/><circle cx="62" cy="139" r="13" fill="#1D4ED8"/><text x="62" y="143.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="86" y="136" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">Patient authentication</text><text x="86" y="152" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">Transaction-bound OTP: HMAC stored, 5 min, single use, 5 attempts + lockout</text><rect x="44" y="168" width="812" height="44" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.3"/><circle cx="70" cy="190" r="13" fill="#1D4ED8"/><text x="70" y="194.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="94" y="187" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">Consent</text><text x="94" y="203" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">Patient-chosen doctor, scopes, 1/7/30-day expiry; revoke / end now</text><rect x="52" y="219" width="796" height="44" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.3"/><circle cx="78" cy="241" r="13" fill="#0F766E"/><text x="78" y="245.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="102" y="238" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">Document security</text><text x="102" y="254" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">Validation, isolated worker, structural PDF scan, sanitise, malware scan, quarantine</text><rect x="60" y="270" width="780" height="44" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.3"/><circle cx="86" cy="292" r="13" fill="#0F766E"/><text x="86" y="296.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="110" y="289" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">Encryption / vault</text><text x="110" y="305" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">AES-256-GCM per document (envelope), field-level encryption, separate identity DB</text><rect x="68" y="321" width="764" height="44" rx="8" fill="#F1EBFE" stroke="#6D28D9" stroke-width="1.3"/><circle cx="94" cy="343" r="13" fill="#6D28D9"/><text x="94" y="347.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="118" y="340" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="start">Provenance</text><text x="118" y="356" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">Quote-or-reject; every fact has quote, page, bbox, confidence, document hash</text><rect x="76" y="372" width="748" height="44" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.3"/><circle cx="102" cy="394" r="13" fill="#1D4ED8"/><text x="102" y="398.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="126" y="391" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">Doctor MFA</text><text x="126" y="407" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">scrypt password + TOTP with replay block; lockout; server-side sessions + CSRF</text><rect x="84" y="423" width="732" height="44" rx="8" fill="#EAF1FE" stroke="#1D4ED8" stroke-width="1.3"/><circle cx="110" cy="445" r="13" fill="#1D4ED8"/><text x="110" y="449.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="134" y="442" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="start">Authorization</text><text x="134" y="458" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">Deny-by-default roles + consent + scope checked on every request; generic 403</text><rect x="92" y="474" width="716" height="44" rx="8" fill="#E6F4F1" stroke="#0F766E" stroke-width="1.3"/><circle cx="118" cy="496" r="13" fill="#0F766E"/><text x="118" y="500.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><text x="142" y="493" font-size="13" font-weight="700" fill="#0F766E" text-anchor="start">Evidence controls</text><text x="142" y="509" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">Single-use 60 s session-bound token, watermarked render, no download</text><rect x="100" y="525" width="700" height="44" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.3"/><circle cx="126" cy="547" r="13" fill="#475569"/><text x="126" y="551.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text><text x="150" y="544" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Audit chain</text><text x="150" y="560" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">SHA-256 hash chain + HMAC, append-only triggers, anchored head, auditor verify</text><rect x="108" y="576" width="684" height="44" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.3"/><circle cx="134" cy="598" r="13" fill="#475569"/><text x="134" y="602.5" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text><text x="158" y="595" font-size="13" font-weight="700" fill="#475569" text-anchor="start">Retention</text><text x="158" y="611" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">Crypto-shredding after 90 days and for unverified uploads; delete = destroy key first</text><text x="450" y="639" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="middle">All twelve layers are implemented in the repository; demo-grade parts are named in Section 29.</text></svg>